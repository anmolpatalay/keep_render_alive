name: Keep Render Awake

on:
  schedule:
    - cron: '* * * * *'  # every minute
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render App
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" https://ansh-the-couples-app.onrender.com/login

